name: CI

# Tests (busted) and luacheck on every push and pull request, as in Completao. Lua 5.1: the game's version.
on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          files: Aggreao.lua Localization Modules Aggreao.test.lua test setupTests.lua
          args: -q

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v5

      - name: Install busted
        run: luarocks install busted

      - name: Run tests
        run: busted -p ".test.lua" .
